<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward" />
    <title>myArt</title>
    <link rel="stylesheet" href="styles/draw-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
</head>
<body class="draw-page">

<nav class="navbar">
  <div class="nav-logo">LiamDG</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About Me</a></li>
    <li><a href="hometown.html">My Hometown</a></li>
    <li><a href="schools.html">My Schools</a></li>
    <li class="dropdown">
      <a href="#" class="dropbtn">Hobbies ▼</a>
      <ul class="dropdown-content">
        <li><a href="games.html">Video Games</a></li>
        <li><a href="books.html">Books</a></li>
        <li><a href="drawing.html">Drawing</a></li>
      </ul>
    </li>
  </ul>
</nav>

<div class="draw-content">
  <div class="draw-header">
    <p>Check out my drawings</p>
  </div>

  <div class="draw swiper">
    <div class="card-wrapper">
      <ul class="card-list swiper-wrapper">
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art1.jpg" alt="Art 1" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art2.png" alt="Art 2" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art3.jpg" alt="Art 3" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art4.jpg" alt="Art 4" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art5.jpg" alt="Art 5" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art6.jpg" alt="Art 6" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art7.jpg" alt="Art 7" class="card-image">
          </div>
        </li>
        <li class="card-item swiper-slide">
          <div class="card-link">
            <img src="images/art/art8.jpg" alt="Art 8" class="card-image">
          </div>
        </li>
      </ul>

      <div class="swiper-pagination"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
  </div>
</div>

<div id="artModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="javascript/swiper.js"></script>
</body>
</html>
